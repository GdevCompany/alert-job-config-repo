management.endpoints.web.exposure.include: health,info,metrics,prometheus

credential.validation.otp.timeout.ms=120000

# История автоответов и очередь отложенных повторов (MariaDB, схема notification_db)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.datasource.username=${database_user}
spring.datasource.password=${database_user_password}
spring.datasource.url=jdbc:mariadb://db:3306/notification_db?useUnicode=true&characterEncoding=utf-8&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC&autoReconnect=true
spring.datasource.hikari.connection-timeout=5000
